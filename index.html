
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <title>Sun Chaser</title>
    <meta name="description" content="Track the sun and moon positions with real-time weather" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- PWA Configuration - Vite PWA will inject manifest -->
    <meta name="theme-color" content="#0F1016" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Sun Chaser" />

    <!-- Apple PWA Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sun Chaser" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Microsoft PWA Configuration -->
    <meta name="msapplication-TileColor" content="#0F1016" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <meta property="og:title" content="Sun Chaser" />
    <meta property="og:description" content="Track the sun and moon positions with real-time weather" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
  </head>

  <body>
    <!-- Item 165: the loading screen's mark (LoadingScreen.tsx) before the script arrives, in
         the first frame of its rise (sun still under the water), so a slow connection shows
         the app at once. React replaces it on its first render. -->
    <div id="root"><div style="position:fixed;inset:0;background:#0F1016"><svg viewBox="0 0 120 120" width="136" height="136" aria-hidden="true" style="position:absolute;left:50%;top:calc(36% - 68px);margin-left:-68px"><defs><clipPath id="boot-mark-clip"><circle cx="60" cy="60" r="58"/></clipPath><linearGradient id="boot-mark-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A4A8C"/><stop offset=".55" stop-color="#F97316"/><stop offset="1" stop-color="#FEC6A1"/></linearGradient></defs><g clip-path="url(#boot-mark-clip)"><rect width="120" height="84" fill="url(#boot-mark-sky)"/><rect y="84" width="120" height="36" fill="#0EA5E9"/></g><circle cx="60" cy="60" r="58" fill="none" stroke-width="2" stroke="#FEC6A1" stroke-opacity=".35"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
