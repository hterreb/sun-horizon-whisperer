    <linearGradient id="fav-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A4A8C"/>
      <stop offset=".55" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FEC6A1"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#fav-clip)">
